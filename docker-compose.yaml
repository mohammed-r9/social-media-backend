services:
  db:
    container_name: primary_db
    image: postgres:latest
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_CONNECTION: "postgres://test:test@localhost:5432/test?sslmode=disable"
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_USER: test
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    command: redis-server --requirepass test
    ports:
      - "6379:6379"
    volumes:
      - ./database/redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bruh", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

